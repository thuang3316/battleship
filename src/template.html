<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>BATTLESHIP</h1>
        <p>Naval Combat Simulation</p>
    </header>

    <div id="status-bar">
        <span class="stat-label">HITS</span>
        <span class="stat-val" id="human-hits">0</span>
        <span class="divider">|</span>
        <span id="status-message">PLACE YOUR SHIPS</span>
        <span class="divider">|</span>
        <span class="stat-label">ENEMY SUNK</span>
        <span class="stat-val" id="enemy-sunk">0</span>
        <span class="divider">|</span>
        <button id="restart-btn" class="btn restart" style="display:none">↺ RESTART</button>
    </div>

    <div id="fleet-tracker"></div>

    <div class="boards-container">
        <div class="board-section">
            <div class="board-label">YOUR WATERS</div>
            <div id="humanBoard" class="board"></div>
        </div>

        <div id="placement-panel"></div>

        <div class="board-section">
            <div class="board-label">ENEMY WATERS</div>
            <div id="computerBoard" class="board opponent"></div>
        </div>
    </div>

    <dialog>
        <h2 class="win"></h2>
        <p></p>
        <button>PLAY AGAIN</button>
    </dialog>

</body>
</html>
